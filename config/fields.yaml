# Generic Field Definitions for RFP Intelligence Platform
# Note: Zero bid-specific examples, vendor names, or hard-coded solicitation numbers are permitted here.

fields:
  Bid Number:
    specialist: "commercial_legal"
    description: "Official solicitation, RFP, IFB, or PORFP identifier assigned by the issuing authority. When both a primary PORFP/solicitation number (e.g. #E20P4600040) and an eMMA project number (e.g. BPM044557) appear, use the PORFP number as the value and record the eMMA project number in notes."
    format: "string"
    query_expansion_hints:
      - "solicitation number"
      - "RFP number"
      - "bid number"
      - "PORFP number"
      - "solicitation identifier"
      - "reference number"
      - "project number"

  Title:
    specialist: "product_specs"
    description: "Full official title of the bid solicitation or RFP package."
    format: "string"
    query_expansion_hints:
      - "solicitation title"
      - "project title"
      - "bid name"
      - "request for proposal title"

  Due Date:
    specialist: "dates_logistics"
    description: "Final deadline for proposal or bid submission including time and timezone, reflecting any addendum modifications."
    format: "YYYY-MM-DD HH:MM TZ"
    query_expansion_hints:
      - "proposal due date"
      - "submission deadline"
      - "closing date"
      - "bid opening date"
      - "new due date"
      - "extended deadline"

  Bid Submission Type:
    specialist: "dates_logistics"
    description: "Method required for submitting the bid (e.g., electronic procurement portal, sealed physical delivery, email)."
    format: "string"
    query_expansion_hints:
      - "submission method"
      - "submission instructions"
      - "electronic submission"
      - "sealed bid delivery"
      - "how to submit"

  Term of Bid:
    specialist: "dates_logistics"
    description: "Initial contract term/duration and any renewal or extension options."
    format: "string"
    query_expansion_hints:
      - "contract term"
      - "contract duration"
      - "period of performance"
      - "renewal options"
      - "contract length"

  Pre Bid Meeting:
    specialist: "dates_logistics"
    description: "Date, time, location, conference details and whether attendance is mandatory, optional, or 'None' if no meeting is mentioned or scheduled in the solicitation documents."
    format: "string"
    query_expansion_hints:
      - "pre-proposal meeting"
      - "pre-bid conference"
      - "pre bid meeting date time"
      - "vendor conference"
      - "mandatory pre-bid"

  Installation:
    specialist: "dates_logistics"
    description: "Whether on-site installation, configuration, staging, deployment, or imaging services are required by the solicitation. If no on-site installation is required or only factory configuration is specified, state 'No on-site installation required; factory configuration per specifications' or 'None'. Never output raw table text."
    format: "string"
    query_expansion_hints:
      - "installation required"
      - "deployment services"
      - "on-site installation"
      - "device setup"
      - "staging deployment"

  Bid Bond Requirement:
    specialist: "commercial_legal"
    description: "Required bid bond, surety, proposal guarantee, dollar amount, percentage, or 'Not required'. If bond requirements are deferred to other contract documents without a specific amount stated in the RFP, succinctly state that no specific bid bond amount is given and the RFP defers to other contract documents."
    format: "string"
    query_expansion_hints:
      - "bid bond"
      - "bid security"
      - "surety requirement"
      - "insurance and bonds"
      - "proposal guarantee"
      - "bonds enumerated elsewhere"

  Delivery Date:
    specialist: "dates_logistics"
    description: "Required delivery date, delivery window, or turnaround days after receipt of order / contract award."
    format: "string"
    query_expansion_hints:
      - "delivery deadline"
      - "delivery schedule"
      - "days after receipt of order"
      - "delivery within days"
      - "lead time"
      - "delivery timeline"

  Payment Terms:
    specialist: "commercial_legal"
    description: "Payment terms, prompt payment window, and invoicing instructions from the buyer/district to the contractor (e.g. invoice submission within N days of delivery, Net 30). Restrict strictly to buyer-to-contractor terms; do NOT extract subcontractor prompt-payment pass-through clauses. If buyer payment terms are not specified in the solicitation, return null with note stating buyer payment terms are not specified."
    format: "string"
    query_expansion_hints:
      - "invoicing instructions"
      - "invoice"
      - "payment"
      - "remit"
      - "net days"
      - "payment terms"
      - "invoices submitted"
      - "billing instructions"

  Any Additional Documentation Required:
    specialist: "commercial_legal"
    description: "Required affidavits, compliance forms, certifications, insurance certificates, Form 1295, W-9, conflict of interest (CIQ), letter of intent, or tax documents required to be submitted with the proposal."
    format: "string"
    query_expansion_hints:
      - "required affidavits"
      - "mandatory forms"
      - "form 1295"
      - "conflict of interest CIQ"
      - "certificate of insurance"
      - "letter of intent"
      - "compliance documentation"

  MFG for Registration:
    specialist: "commercial_legal"
    description: "Manufacturer(s) or OEM brand name with which the bidder must be a certified or authorized partner/reseller."
    format: "string"
    query_expansion_hints:
      - "manufacturer authorization"
      - "partner certification"
      - "authorized reseller"
      - "OEM authorization"
      - "deal registration"

  Contract or Cooperative to use:
    specialist: "commercial_legal"
    description: "Referenced purchasing cooperative, state master contract, or GSA schedule vehicle, if applicable."
    format: "string"
    query_expansion_hints:
      - "master contract"
      - "cooperative purchasing"
      - "piggyback contract"
      - "purchasing vehicle"
      - "state contract"

  Model_no:
    specialist: "product_specs"
    description: "Model number(s), product family name, series, or hardware chassis identifiers (e.g. Latitude 5550, ThinkPad L15). Distinct from orderable part numbers or SKUs."
    format: "string"
    query_expansion_hints:
      - "model number"
      - "product family"
      - "product model"
      - "model #"
      - "equipment model"
      - "hardware model"

  Part_no:
    specialist: "product_specs"
    description: "Orderable part number(s), SKU numbers, manufacturer part numbers (MPN), or component codes for the base system and accessories (e.g. base system SKU, dock part number, WD22TB4). Distinct from product model family."
    format: "string"
    query_expansion_hints:
      - "part number"
      - "SKU"
      - "manufacturer part number"
      - "dock part number"
      - "base system SKU"
      - "item number"
      - "ordering code"

  Product:
    specialist: "product_specs"
    description: "Name, category, and quantity of requested equipment, software, or items."
    format: "string"
    query_expansion_hints:
      - "product name"
      - "quantity required"
      - "item description"
      - "equipment requested"
      - "bill of materials"

  contact_info:
    specialist: "commercial_legal"
    description: "Designated procurement officer or buyer contact details: name, email address, and telephone number."
    format: "string"
    query_expansion_hints:
      - "procurement officer"
      - "contact person"
      - "buyer email"
      - "contract administrator"
      - "questions contact"

  company_name:
    specialist: "commercial_legal"
    description: "Name of the issuing public agency, school district, municipality, or buying organization."
    format: "string"
    query_expansion_hints:
      - "issuing agency"
      - "procuring entity"
      - "school district"
      - "organization name"
      - "department name"

  Bid Summary:
    specialist: "product_specs"
    description: "A concise 3 to 6 sentence synthesis outlining the procurement scope, objectives, requirements, requested equipment/quantities, and deliverables. Never return NOT_FOUND if the solicitation contains scope of work, project description, or equipment specifications; synthesize the summary from available scope evidence even if there is no explicit 'Executive Summary' section."
    format: "string"
    query_expansion_hints:
      - "scope of work"
      - "executive summary"
      - "project background"
      - "purpose of solicitation"
      - "procurement overview"
      - "requested equipment"

  Product Specification:
    specialist: "product_specs"
    description: "Key technical hardware and software requirements (e.g., processor/CPU, memory/RAM, storage/SSD, display, ports, operating system, warranty)."
    format: "string"
    query_expansion_hints:
      - "technical specifications"
      - "hardware specifications"
      - "minimum requirements"
      - "processor ram storage"
      - "display warranty requirements"
